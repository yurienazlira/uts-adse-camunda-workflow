spring.application.name=workflow-proposal
server.port=8080

# Kredensial default admin Camunda Webapp
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin
camunda.bpm.admin-user.first-name=Admin
camunda.bpm.admin-user.last-name=User

# Buat filter bawaan agar task langsung muncul di Tasklist
camunda.bpm.filter.create=All tasks

# WAJIB: Otomatis scan dan deploy diagram BPMN dari folder resources
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.deployment-resource-pattern=classpath*:**/*.bpmn